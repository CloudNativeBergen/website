[tools]
node = "24"
pnpm = "10"
fnox = "latest"
cue = "0.17"
"npm:wrangler" = "4"

[tasks.setup]
description = "Enable the tracked git hooks (.githooks)"
run = "git config core.hooksPath .githooks"

[tasks.all]
description = "Run all checks, tests, and build sequentially"
run = [
  "mise run check",
  "mise run test",
  "mise run build"
]

[tasks.dev]
description = "Start the Next.js development server with Turbopack"
run = "fnox exec -- pnpm run dev"

[tasks.build]
description = "Build the application for production"
run = "fnox exec -- pnpm run build"

[tasks.doctor]
description = "Check toolchain and credentials (node, pnpm, fnox, Sanity token, wrangler, gh)"
run = "pnpm run -s doctor"

[tasks.clean]
description = "Remove build artifacts and cached files"
run = "rm -rf .next storybook-static dist"

[tasks.test]
description = "Run all tests"
run = "mise -E test exec -- fnox exec -- pnpm run -s test"

[tasks.check]
description = "Run all checks (lint, typecheck, format, knip)"
run = "fnox exec -- pnpm run -s check"

[tasks.format]
description = "Format code using Prettier"
run = "fnox exec -- pnpm run -s format"

[tasks.lint]
description = "Run ESLint"
run = "fnox exec -- pnpm run -s lint"

[tasks.typecheck]
description = "Run TypeScript type checks"
run = "fnox exec -- pnpm run -s typecheck"

[tasks.storybook]
description = "Start Storybook development server"
run = "fnox exec -- pnpm run storybook"

[tasks.sanity]
description = "Run sanity commands"
run = "fnox exec -- pnpm sanity {{args}}"

[tasks.migrate]
description = "Run a Sanity content migration (usage: mise run migrate -- <migration-name>)"
run = "fnox exec -- npx sanity@latest migration run {{args}}"

[tasks.migrate-create]
description = "Create a new Sanity migration (usage: mise run migrate-create -- \"description\")"
run = "fnox exec -- npx sanity@latest migration create {{args}}"

[tasks.migrate-validate]
description = "Validate documents against current schema"
run = "fnox exec -- npx sanity@latest documents validate -y"

[tasks.lint-fix]
description = "Run ESLint with auto-fix"
run = "fnox exec -- pnpm run -s lint:fix"

[tasks.test-watch]
description = "Run tests in watch mode"
run = "mise -E test exec -- fnox exec -- pnpm run test:watch"

[tasks.test-badges]
description = "Run badge-specific tests"
run = "mise -E test exec -- fnox exec -- pnpm run test:badges"

[tasks.storybook-test]
description = "Build and test Storybook stories (CI mode)"
run = "fnox exec -- pnpm run storybook:test-ci"

[tasks.manage-files]
description = "Manage orphaned uploaded files"
run = "fnox exec -- pnpm run manage-orphaned-files"

[tasks.install]
description = "Install dependencies"
run = "pnpm install"

# Local API (#1772): gateway + every subgraph in one wrangler dev, local D1
# with a seeded fixture, local-only keys. docs/PLATFORM.md "Local development".
[tasks."dev:api:setup"]
description = "Local API: dev keys, D1 migrations and seed fixture (local only)"
run = '''
set -e
W=api/node_modules/.bin/wrangler
P=.wrangler/dev-api
node scripts/dev-api.mjs setup
for s in identity tenant-directory conference; do
  CI=1 $W d1 migrations apply DB --local -e preview -c services/$s/wrangler.jsonc --persist-to $P >/dev/null
  $W d1 execute DB --local -e preview -c services/$s/wrangler.jsonc --persist-to $P --file scripts/dev-seed/$s.sql >/dev/null
done
$W d1 execute DB --local -e preview -c services/identity/wrangler.jsonc --persist-to $P --file $P/jwks.sql >/dev/null
pnpm --filter @runkonf/api -s compose
'''

[tasks."dev:api"]
description = "Run the gateway and every subgraph locally on http://localhost:8787"
depends = ["dev:api:setup"]
run = '''
cat <<'MSG'

Local gateway: http://localhost:8787/graphql

  # health, anonymous
  curl -s localhost:8787/graphql -H 'content-type: application/json' -d '{"query":"{ health }"}'

  # tenant read, tenant resolved from Origin
  curl -s localhost:8787/graphql -H 'content-type: application/json' \
    -H 'origin: https://cndn.konf.localhost' \
    -d '{"query":"{ conferenceLifecycle rolloutFlags { apiRead } conference { title city } }"}'

  # operator lane: myOrganizations with a dev token
  curl -s localhost:8787/graphql -H 'content-type: application/json' \
    -H 'origin: http://localhost:3000' -H "authorization: Bearer $(mise run -q dev:token)" \
    -d '{"query":"{ myOrganizations { name role conferenceEditions { id } } }"}'

MSG
exec api/node_modules/.bin/wrangler dev -e preview --persist-to .wrangler/dev-api --port 8787 \
  -c api/wrangler.jsonc -c services/identity/wrangler.jsonc \
  -c services/tenant-directory/wrangler.jsonc -c services/content/wrangler.jsonc \
  -c services/conference/wrangler.jsonc -c services/program/wrangler.jsonc
'''

[tasks."dev:token"]
description = "Local API: mint a 5-minute dev identity JWT (args: [userId] [origin])"
run = "node scripts/dev-api.mjs token"

[tasks."dev:api:reset"]
description = "Local API: wipe the local D1 state (dev keys stay)"
run = "rm -rf .wrangler/dev-api/v3"

[env]
NEXT_TELEMETRY_DISABLED = "1"
NEXT_PUBLIC_SANITY_PROJECT_ID = "mvzwvw14"
NEXT_PUBLIC_SANITY_DATASET = "production"
SANITY_STUDIO_PROJECT_ID = "mvzwvw14"
SANITY_STUDIO_DATASET = "production"


