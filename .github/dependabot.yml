version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/' # Location of package manifests
    schedule:
      interval: 'monthly'
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'
    cooldown:
      semver-patch-days: 3
    ignore:
      # TypeScript 7 is the native compiler: its npm package exports only
      # `lib/version.cjs`, so the JS compiler API (`ts.createSourceFile` and
      # everything reached through it) no longer exists. Four test helpers parse
      # source with it, and typescript-eslint 8 throws on import when
      # `versionMajorMinor >= 7`, which kills `pnpm lint` outright. Lift this
      # once typescript-eslint ships TS >=7.1 support
      # (typescript-eslint/typescript-eslint#10940) and the helpers have a
      # parser again.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @portabletext/editor 8 removed the render-function types and the
      # matching props on PortableTextEditable (`renderStyle`,
      # `renderDecorator`, `renderAnnotation`, `renderListItem`), which
      # PortableTextEditor.tsx passes. Migrating is a UI change needing visual
      # verification, so it wants its own PR rather than a seat in a group of
      # twenty-five.
      - dependency-name: '@portabletext/editor'
        update-types: ['version-update:semver-major']
