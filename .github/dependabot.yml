version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/' # Location of package manifests
    schedule:
      interval: 'monthly'
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'
    cooldown:
      semver-patch-days: 3
    # These rules apply to SECURITY updates too. A CVE fixed only in a version
    # an entry below suppresses will not raise a PR, and nothing announces the
    # suppression — so check Dependabot alerts for every package named here when
    # lifting a pin. Fixes that land inside the still-allowed range are
    # unaffected (for knip that is patches only, since minor is suppressed too).
    ignore:
      # TypeScript 7 is the native compiler: its npm package's root export is
      # `lib/version.cjs` (three lines), so the JS compiler API
      # (`ts.createSourceFile` and everything reached through it) is no longer
      # reachable — the `./unstable/*` subpaths ship an AST API but no parser,
      # which now lives in Go. Two test helpers and two tests parse in-memory
      # source with the old API. Independently, typescript-eslint 8 throws at
      # import when the major is >= 7, which kills `pnpm lint` outright. Lift
      # once typescript-eslint supports TS >= 7.1
      # (typescript-eslint/typescript-eslint#10940) and the helpers have a
      # parser again.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @portabletext/editor 8 removed the render-function types and the
      # matching props on PortableTextEditable (`renderStyle`,
      # `renderDecorator`, `renderAnnotation`, `renderListItem`), which
      # PortableTextEditor.tsx passes. Migrating is a UI change needing visual
      # verification, so it wants its own PR rather than a seat in a group of
      # twenty-five.
      - dependency-name: '@portabletext/editor'
        update-types: ['version-update:semver-major']
      # @sanity/client 8 dropped the `unstable__adapter` export that
      # next-sanity 13.3 imports at the top of its entry module, so the
      # Storybook preview build dies with MISSING_EXPORT before any story
      # renders. Nothing in our own code touches that export — the constraint
      # lives entirely in next-sanity. Lift once next-sanity ships a release
      # that declares `@sanity/client` 8 support.
      - dependency-name: '@sanity/client'
        update-types: ['version-update:semver-major']
      # knip 6.34 walks the test files that `knip.json` deliberately keeps out
      # of `project` (`!**/__tests__/**`, `!src/**/*.test.{ts,tsx}`) and reports
      # what it finds there: ~118 unlisted dependencies, ~182 unused exports,
      # ~122 unused types, all of them test-only. Disabling knip's vitest plugin
      # makes it worse, not better, so there is no config-level fix — the
      # suppression has to hold the version. MINOR is suppressed as well as
      # major because the break arrived in a minor (6.26 → 6.34): a major-only
      # ignore would not stop this PR being re-proposed. Patches inside 6.26.x
      # still flow. Lift once knip honours the `project` exclusions again.
      - dependency-name: 'knip'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']
