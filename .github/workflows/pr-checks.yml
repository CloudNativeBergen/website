name: PR Checks

on:
  pull_request:
    branches: ['**']
  # Required for the merge queue: queued PRs are validated via merge_group
  # events, and the required "Quality Checks" status must report on them
  merge_group:
  push:
    branches: ['main']

# A push to a PR branch supersedes the run already in flight for it; let the
# stale one die instead of finishing a 5-job matrix nobody will read. Only
# pull_request runs share a group (per ref). main pushes and merge-queue runs
# get a group of their own (the run id), so they are never cancelled AND never
# queue behind each other.
concurrency:
  group: pr-checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # ratchet:pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      # Tenancy ratchet (RunKonf/platform#53 phase 1). `pnpm run lint` above is
      # `eslint .`, which exits 0 on warnings — and `tenancy/no-unscoped-groq` is
      # a warning, which is how every cross-tenant read it flagged still shipped.
      # This step is the one that reads it: it fails when ANY file carries more
      # of those warnings than eslint-rules/no-unscoped-groq.baseline.json
      # allows. Decreases pass. Raising the ceiling means running
      # `pnpm run lint:tenancy:update` and committing the diff.
      # ORDER MATTERS: this step reads the `.eslintcache` the linter step above
      # just wrote, so it costs ~2s. Moved before "Run linter" it silently
      # relints the whole repo (~50s) — no failure, just the time back.
      - name: Run tenancy lint ratchet
        run: pnpm run lint:tenancy

      - name: Run type check
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm run format:check

      - name: Run knip
        run: pnpm run knip

      # The real invariant behind the `no-restricted-imports` rule on
      # `migrations/**`: the Sanity CLI loads EVERY migration to list them, so
      # one import whose graph reaches a module its loader cannot parse breaks
      # discovery for all of them (#799). The lint rule only proxies for that by
      # banning barrel paths, and cannot see a relative import, a dynamic one,
      # or a deep module that later grows a `.tsx` import. This runs the loader
      # itself. No credentials — it is a local scan — and about a second.
      - name: List Sanity migrations
        run: pnpm sanity migration list

      # The hosted Studio is only built by deploy-studio.yml AFTER a merge to
      # main, so a dependency bump that breaks the Studio bundle (a plugin bound
      # to the wrong @sanity/ui copy, a removed export) sails through PR checks
      # and surfaces as a red post-merge deploy — that is how the deploy stayed
      # broken from 2026-09-05 to 2026-09-13. Build it here instead.
      # No credentials needed: the project id and dataset are only inlined into
      # the bundle, and the output is discarded. About two seconds.
      - name: Build Sanity Studio
        run: pnpm sanity build ${{ runner.temp }}/studio -y

  # The suite is ~800 files and ~85% per-file fixed cost (import, setup,
  # environment), so wall time scales with file count and the only lever
  # that does not touch test code is running fewer files per runner. Each
  # shard runs its slice WITH coverage and writes a blob report; the "Tests"
  # job below merges the blobs and is the ONLY place thresholds are judged
  # (a per-shard threshold would be meaningless — each shard sees a slice of
  # the callers). "Tests" is the required status check, so it must keep that
  # exact name and must report even when a shard FAILS: `if: !cancelled()`
  # (runs on failure, skips only on a cancelled run) plus an explicit
  # shard-result check does that.
  tests-shard:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # To add a shard, append here AND in the other matrix below; the fan-in
      # jobs read the count from strategy.job-total.
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # ratchet:pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Thresholds are skipped on a shard (vitest.config.ts keys that on the
      # `--shard` flag): a shard sees a slice of the callers, so only the
      # merged report can judge them.
      - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }}) with coverage
        run: >
          pnpm vitest run --coverage
          --reporter=default --reporter=blob
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          # Vitest 5 writes blob reports here (not `.vitest-reports/`).
          path: .vitest/blob/
          # Long enough that `gh run rerun --failed` days later still finds the
          # blobs of the shards it did not rerun; the merge step below also
          # refuses to run on fewer blobs than shards.
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  tests:
    name: Tests
    needs: tests-shard
    # Not `always()`: that is true on a CANCELLED run too, and every superseded
    # PR push would then spend a checkout+install to report "cancelled".
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # ratchet:pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # ratchet:actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob/
          merge-multiple: true

      # A shard that crashed before writing its blob (OOM, timeout) would only
      # surface below as a confusing merge error. Judge the shards' own verdict
      # FIRST so the log points at the real cause.
      - name: Fail if any shard did not succeed
        if: needs.tests-shard.result != 'success'
        run: |
          echo "::error::tests-shard result is '${{ needs.tests-shard.result }}'"
          exit 1

      # A rerun after the artifacts expired, or a download that matched fewer
      # artifacts than shards, would merge a PARTIAL suite and judge the auth
      # thresholds on half the callers. Refuse unless every shard's blob is here.
      - name: Require one blob per shard
        run: |
          # Vitest names each blob `blob-<index>-<total>.json`, so the files
          # themselves say how many shards there were.
          total=$(ls .vitest/blob/blob-*.json | head -1 | sed -E 's/.*blob-[0-9]+-([0-9]+)\.json/\1/')
          missing=0
          for i in $(seq 1 "$total"); do
            [ -f ".vitest/blob/blob-$i-$total.json" ] || { echo "::error::blob-$i-$total.json is missing"; missing=1; }
          done
          echo "shards=$total blobs=$(ls .vitest/blob/blob-*.json | wc -l | tr -d ' ')"
          [ "$missing" -eq 0 ]

      # Merges every shard's results into one report and applies the scoped
      # auth coverage thresholds from vitest.config.ts (only the auth modules
      # listed there are instrumented; unrelated files can never fail this).
      # Exits non-zero on a failed test in any shard or a missed threshold.
      - name: Merge shard reports and apply scoped auth coverage gate
        run: pnpm vitest run --merge-reports --coverage

      # A threshold glob that matches no file in the merged map passes
      # silently. Prove every gated file was actually judged.
      - name: Assert every gated file is in the merged coverage report
        run: pnpm tsx scripts/assert-gated-coverage.ts

  # Same shape as the vitest shards: ~1,900 stories at ~0.15s each on a
  # 4-vCPU runner is the whole job, and the runner is not worker-bound
  # (--maxWorkers=100% measured no faster than 50%). Each shard builds the
  # static Storybook itself (~13s) rather than passing it between jobs.
  storybook-shard:
    name: Storybook Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # To add a shard, append here AND in the other matrix below; the fan-in
      # jobs read the count from strategy.job-total.
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # ratchet:pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Initialize MSW
        run: pnpm msw init public --save=false

      # `storybook:test-ci` forwards STORYBOOK_SHARD as `--shard=i/n` to
      # test-storybook; unset (local runs) it runs every story.
      - name: Run Storybook tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: pnpm run storybook:test-ci
        env:
          STORYBOOK_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

  # Required status check; must keep this exact name. No checkout needed.
  storybook:
    name: Storybook Tests
    needs: storybook-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any shard did not succeed
        if: needs.storybook-shard.result != 'success'
        run: |
          echo "::error::storybook-shard result is '${{ needs.storybook-shard.result }}'"
          exit 1
      - name: All shards green
        if: needs.storybook-shard.result == 'success'
        run: echo "All Storybook shards passed"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # ratchet:pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          # CI environment variables (dummy values for build verification).
          # These MUST match the Auth.js v5 names the code actually reads
          # (see src/lib/auth.ts): AUTH_SECRET + AUTH_<PROVIDER>_ID/SECRET.
          # The legacy v4 name (NEXTAUTH_SECRET) is not read by the app.
          NODE_ENV: production
          AUTH_SECRET: ci-build-secret-not-for-production
          AUTH_GITHUB_ID: ci-build-github-id-not-for-production
          AUTH_GITHUB_SECRET: ci-build-github-secret-not-for-production
          AUTH_LINKEDIN_ID: ci-build-linkedin-id-not-for-production
          AUTH_LINKEDIN_SECRET: ci-build-linkedin-secret-not-for-production
          # Still read at runtime by src/lib/contract-signing/self-hosted.ts.
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_build_key_not_for_production
          INVITATION_TOKEN_SECRET: ci_invitation_token_secret_not_for_production
          # Web push (#444). Dummy VAPID values so `next build` compiles; no
          # notification is ever delivered in CI. Generate REAL keys for prod
          # with `pnpm tsx scripts/gen-vapid-keys.ts`.
          VAPID_PUBLIC_KEY: ci_vapid_public_key_not_for_production
          VAPID_PRIVATE_KEY: ci_vapid_private_key_not_for_production
          VAPID_SUBJECT: mailto:ci@example.com

  # POST-BUILD RUNTIME SMOKE TEST (#671). `next build` COMPILES the broken
  # lazy-auth-config form fine and vitest mocks next-auth, so neither the Build
  # nor the Tests job can catch a runtime middleware regression like #462
  # (`nextAuthMiddleware is not a function`, 500 on every authenticated route).
  # This job boots the REAL production server and curls PROTECTED routes (which
  # run the middleware — the exact failure surface), failing loudly on any 500
  # or `is not a function` / `TypeError` signature. Kept a separate, distinctly
  # NAMED job so it can be added to the required-status ruleset in branch
  # protection. A protected-route redirect needs no real backend/secrets.
  smoke:
    name: Runtime Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ratchet:actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # ratchet:pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # ratchet:actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          # Same placeholder env as the Build job — a `next build` must compile
          # with these dummy Auth.js v5 secrets (no real backend is contacted).
          NODE_ENV: production
          AUTH_SECRET: ci-build-secret-not-for-production
          AUTH_GITHUB_ID: ci-build-github-id-not-for-production
          AUTH_GITHUB_SECRET: ci-build-github-secret-not-for-production
          AUTH_LINKEDIN_ID: ci-build-linkedin-id-not-for-production
          AUTH_LINKEDIN_SECRET: ci-build-linkedin-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_build_key_not_for_production
          INVITATION_TOKEN_SECRET: ci_invitation_token_secret_not_for_production
          VAPID_PUBLIC_KEY: ci_vapid_public_key_not_for_production
          VAPID_PRIVATE_KEY: ci_vapid_private_key_not_for_production
          VAPID_SUBJECT: mailto:ci@example.com

      - name: Smoke-test protected routes against a live server
        run: node scripts/smoke-protected-routes.mjs
        env:
          # `next start` runs the production bundle. A protected-route redirect
          # needs no real secrets; these dummy values just satisfy config reads.
          NODE_ENV: production
          AUTH_SECRET: ci-build-secret-not-for-production
          AUTH_GITHUB_ID: ci-build-github-id-not-for-production
          AUTH_GITHUB_SECRET: ci-build-github-secret-not-for-production
          AUTH_LINKEDIN_ID: ci-build-linkedin-id-not-for-production
          AUTH_LINKEDIN_SECRET: ci-build-linkedin-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
