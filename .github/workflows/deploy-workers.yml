name: Deploy Workers

# Deploys the api.konf.app gateway (api/) and its subgraph Workers
# (services/*) to Cloudflare (#1799, epic #1772).
#
# - Pull request: deploys to the `preview` env with the preview token.
# - Push to main (or manual dispatch on main): deploys to the `production` env. The job runs in the GitHub
#   environment `workers-production`, so its required reviewers approve every
#   production deploy, D1 migrations included.
#
# Required configuration, per GitHub environment (`workers-preview`,
# `workers-production`; `Preview`/`Production` belong to Vercel):
#   secrets.CLOUDFLARE_API_TOKEN   - a separate token per environment; the
#                                    preview token never sees production
#   secrets.CLOUDFLARE_ACCOUNT_ID  - repository or environment secret
#
# Only the Workers whose files changed are deployed (#2191,
# scripts/changed-workers.sh). Push diffs against the last successful
# production deploy, PRs against their base. Shared inputs deploy everything,
# and the gateway follows any subgraph. workflow_dispatch deploys everything.

on:
  pull_request:
    paths:
      - 'api/**'
      - 'services/**'
      - 'packages/**'
      - 'src/lib/**'
      - 'pnpm-lock.yaml'
      - 'scripts/changed-workers.sh'
      - 'scripts/secrets-sync.ts'
      - '.github/workflows/deploy-workers.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'services/**'
      - 'packages/**'
      - 'src/lib/**'
      - 'pnpm-lock.yaml'
      - 'scripts/changed-workers.sh'
      - 'scripts/secrets-sync.ts'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PLACEHOLDER until #1785 (Hive Gateway in api/) lands. #1799 wants this
  # job to compose the full and @tag(public) supergraphs from every subgraph
  # SDL, fail when they do not compose, diff the public contract against the
  # last build, and fail when the public contract contains the internal
  # provisioning mutations. There is no gateway or composition tooling in the
  # repo yet, so there is nothing to compose against. Replace this step with
  # the real check in the PR that adds the gateway; deploy keeps `needs` on it.
  compose:
    name: Compose supergraph (placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::notice::Supergraph composition and contract diff are not wired yet (needs #1785)."

  # Keeps the production queue from jamming: an older run waiting for approval
  # blocks every later run in the concurrency group. The newest run deploys all
  # of main, so older waiting/queued runs are redundant. Never touches
  # in_progress runs (a running migration is never cancelled).
  cancel-older:
    name: Cancel older waiting deploys
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4
        with:
          sparse-checkout: scripts/older-deploys.sh
      # A GitHub API blip must not block this run's own deploy (#2053): the
      # only cost of skipping is that an older run may still wait for approval.
      - name: Cancel
        id: cancel
        continue-on-error: true
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/workflows/deploy-workers.yml/runs?branch=main&event=push&per_page=100" \
            | bash scripts/older-deploys.sh \
            | while read -r id; do
                echo "Cancelling older run $id"
                gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true
              done
      - if: steps.cancel.outcome == 'failure'
        run: echo "::warning::Could not list older deploy runs; an older run may still be waiting for approval."

  # An older run that reaches `deploy` after a newer one would replace the
  # newer pending deploy in the concurrency group, and older code would deploy
  # last (#2053). So a run whose commit is no longer main's newest Worker change
  # never enters the group: the newer run deploys all of main. Runs after
  # compose, right before deploy, so the window is the queue time of one job.
  # On an API failure it deploys, as before this check existed.
  newest:
    name: Skip when main has newer Worker changes
    if: github.event_name == 'push'
    needs: [compose]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      newer: ${{ steps.check.outputs.newer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4
        with:
          sparse-checkout: scripts/newer-deploy.sh
      - name: Compare with main
        id: check
        continue-on-error: true
        run: |
          set -euo pipefail
          newer=$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...main" | bash scripts/newer-deploy.sh)
          echo "newer=$newer" >> "$GITHUB_OUTPUT"
          if [ -n "$newer" ]; then
            echo "::notice::main has newer Worker changes (up to $newer); that commit's run deploys them, so this one skips."
          fi
      - if: steps.check.outcome == 'failure'
        run: echo "::warning::Could not compare with main; deploying this commit."

  deploy:
    name: Deploy (${{ github.event_name != 'pull_request' && 'production' || 'preview' }})
    needs: [compose, cancel-older, newest]
    # Fork PRs get no secrets; skip them rather than fail.
    # Dependabot PRs get no environment secrets either.
    # cancel-older and newest are skipped on PRs, so accept skipped as well as
    # success. newest never blocks on its own failure: its output is then empty.
    if: ${{ !cancelled() && needs.compose.result == 'success' && needs.cancel-older.result != 'failure' && needs.newest.outputs.newer == '' && ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name != 'pull_request' && 'workers-production' || 'workers-preview' }}
    concurrency:
      group: deploy-workers-${{ github.event_name != 'pull_request' && 'production' || 'preview' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.event_name != 'pull_request' && 'production' || 'preview' }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test Worker selection
        run: bash scripts/changed-workers.test.sh && bash scripts/newer-deploy.test.sh

      # Push: diff against the head of the newest run whose production deploy
      # succeeded, so changes from skipped, cancelled or failed runs are not
      # lost; else the push's before SHA. Any doubt (no base, base not an
      # ancestor, API failure) deploys everything.
      - name: Select Workers
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base=
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            push)
              base=$(gh api "repos/$REPO/actions/workflows/deploy-workers.yml/runs?branch=main&status=success&per_page=30" --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' 2>/dev/null \
                | while read -r id sha; do
                    if gh api "repos/$REPO/actions/runs/$id/jobs" --jq '.jobs[] | select(.name == "Deploy (production)" and .conclusion == "success") | .name' 2>/dev/null | grep -q .; then
                      echo "$sha"; break
                    fi
                  done || true)
              base=${base:-$BEFORE} ;;
          esac
          if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
            echo "Changes since $base"
            workers=$(git diff --name-only --no-renames "$base" HEAD | bash scripts/changed-workers.sh)
          else
            echo "::notice::No usable base ($EVENT); deploying every Worker."
            workers=$(bash scripts/changed-workers.sh --all)
          fi
          echo "workers=$(paste -sd " " - <<<"$workers")" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying: ${workers:-nothing}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # ratchet:pnpm/action-setup@v6.1.0
        with:
          version: 10.24.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the run before any deploy if the subgraphs do not compose.
      - name: Compose supergraph
        run: pnpm --filter @runkonf/api compose

      # Order matters: tenant-directory binds identity, cfp binds notifications, and the gateway
      # binds all of them, so a binding target is always deployed first.
      - name: Migrate and deploy
        if: steps.select.outputs.workers != ''
        shell: bash
        env:
          WORKERS: ${{ steps.select.outputs.workers }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Production only: fail when a secret declared in secrets.json is
          # missing on the Worker (names only, scripts/secrets-sync.ts).
          check_secrets() {
            if [ "$DEPLOY_ENV" = production ]; then
              pnpm exec tsx scripts/secrets-sync.ts "$1" production --check
            fi
          }
          for pkg in $WORKERS; do
            if [ "$pkg" = api ]; then
              pnpm --filter @runkonf/api exec wrangler deploy --env "$DEPLOY_ENV"
              check_secrets api
              continue
            fi
            echo "::group::$pkg ($DEPLOY_ENV)"
            # `db: false` services (content, program, sponsors, cfp) have no D1 and no migrations.
            if [ -d "services/$pkg/migrations" ]; then
              pnpm --filter "@runkonf/$pkg" exec wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"
            fi
            pnpm --filter "@runkonf/$pkg" exec wrangler deploy --env "$DEPLOY_ENV"
            check_secrets "$pkg"
            echo "::endgroup::"
          done
