name: Deploy Workers

# Deploys the api.konf.app gateway (api/) and its subgraph Workers
# (services/*) to Cloudflare (#1799, epic #1772).
#
# - Pull request: deploys to the `preview` env with the preview token.
# - Push to main: deploys to the `production` env. The job runs in the GitHub
#   environment `workers-production`, so its required reviewers approve every
#   production deploy, D1 migrations included.
#
# Required configuration, per GitHub environment (`workers-preview`,
# `workers-production`; `Preview`/`Production` belong to Vercel):
#   secrets.CLOUDFLARE_API_TOKEN   - a separate token per environment; the
#                                    preview token never sees production
#   secrets.CLOUDFLARE_ACCOUNT_ID  - repository or environment secret

on:
  pull_request:
    paths:
      - 'api/**'
      - 'services/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-workers.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'services/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-workers.yml'

permissions:
  contents: read

jobs:
  # PLACEHOLDER until #1785 (Hive Gateway in api/) lands. #1799 wants this
  # job to compose the full and @tag(public) supergraphs from every subgraph
  # SDL, fail when they do not compose, diff the public contract against the
  # last build, and fail when the public contract contains the internal
  # provisioning mutations. There is no gateway or composition tooling in the
  # repo yet, so there is nothing to compose against. Replace this step with
  # the real check in the PR that adds the gateway; deploy keeps `needs` on it.
  compose:
    name: Compose supergraph (placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::notice::Supergraph composition and contract diff are not wired yet (needs #1785)."

  # Keeps the production queue from jamming: an older run waiting for approval
  # blocks every later run in the concurrency group. The newest run deploys all
  # of main, so older waiting/queued runs are redundant. Never touches
  # in_progress runs (a running migration is never cancelled).
  cancel-older:
    name: Cancel older waiting deploys
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4
        with:
          sparse-checkout: scripts/older-deploys.sh
      - name: Cancel
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/workflows/deploy-workers.yml/runs?branch=main&event=push&per_page=100" \
            | bash scripts/older-deploys.sh \
            | while read -r id; do
                echo "Cancelling older run $id"
                gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true
              done

  deploy:
    name: Deploy (${{ github.event_name == 'push' && 'production' || 'preview' }})
    needs: [compose, cancel-older]
    # Fork PRs get no secrets; skip them rather than fail.
    # Dependabot PRs get no environment secrets either.
    # cancel-older is skipped on PRs, so accept skipped as well as success.
    if: ${{ !cancelled() && needs.compose.result == 'success' && needs.cancel-older.result != 'failure' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'workers-production' || 'workers-preview' }}
    concurrency:
      group: deploy-workers-${{ github.event_name == 'push' && 'production' || 'preview' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # ratchet:pnpm/action-setup@v6.1.0
        with:
          version: 10.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the run before any deploy if the subgraphs do not compose.
      - name: Compose supergraph
        run: pnpm --filter @runkonf/api compose

      # Order matters: tenant-directory binds identity, and the gateway
      # binds all of them, so a binding target is always deployed first.
      - name: Migrate and deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Production only: fail when a secret declared in secrets.json is
          # missing on the Worker (names only, scripts/secrets-sync.ts).
          check_secrets() {
            if [ "$DEPLOY_ENV" = production ]; then
              pnpm exec tsx scripts/secrets-sync.ts "$1" production --check
            fi
          }
          for pkg in identity tenant-directory content conference program; do
            echo "::group::$pkg ($DEPLOY_ENV)"
            # `db: false` services (content, program) have no D1 and no migrations.
            if [ -d "services/$pkg/migrations" ]; then
              pnpm --filter "@runkonf/$pkg" exec wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV"
            fi
            pnpm --filter "@runkonf/$pkg" exec wrangler deploy --env "$DEPLOY_ENV"
            check_secrets "$pkg"
            echo "::endgroup::"
          done
          pnpm --filter @runkonf/api exec wrangler deploy --env "$DEPLOY_ENV"
          check_secrets api
