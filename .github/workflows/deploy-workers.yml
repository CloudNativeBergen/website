name: Deploy Workers

# Deploys the api.konf.app gateway (api/) and its subgraph Workers
# (services/*) to Cloudflare (#1799, epic #1772).
#
# - Pull request: deploys to the `preview` env with the preview token.
# - Push to main: deploys to the `production` env. The job runs in the GitHub
#   environment `production`, so its required reviewers approve every
#   production deploy, D1 migrations included.
#
# A service whose D1 id for the env is still TO_BE_CREATED (see
# services/platform-service.cue) gets `wrangler deploy --dry-run` instead:
# the config and bundle are checked, nothing is created or uploaded. It
# switches to a real deploy once the owner commits the id.
#
# Required configuration, per GitHub environment (`preview`, `production`):
#   secrets.CLOUDFLARE_API_TOKEN   - a separate token per environment; the
#                                    preview token never sees production
#   secrets.CLOUDFLARE_ACCOUNT_ID  - repository or environment secret

on:
  pull_request:
    paths:
      - 'api/**'
      - 'services/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-workers.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'services/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-workers.yml'

permissions:
  contents: read

jobs:
  # PLACEHOLDER until #1785 (Hive Gateway in api/) lands. #1799 wants this
  # job to compose the full and @tag(public) supergraphs from every subgraph
  # SDL, fail when they do not compose, diff the public contract against the
  # last build, and fail when the public contract contains the internal
  # provisioning mutations. There is no gateway or composition tooling in the
  # repo yet, so there is nothing to compose against. Replace this step with
  # the real check in the PR that adds the gateway; deploy keeps `needs` on it.
  compose:
    name: Compose supergraph (placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::notice::Supergraph composition and contract diff are not wired yet (needs #1785)."

  deploy:
    name: Deploy (${{ github.event_name == 'push' && 'production' || 'preview' }})
    needs: compose
    # Fork PRs get no secrets; skip them rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    concurrency:
      group: deploy-workers-${{ github.event_name == 'push' && 'production' || 'preview' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # ratchet:pnpm/action-setup@v6.1.0
        with:
          version: 10.24.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Order matters: tenant-directory binds identity, and the gateway will
      # bind both, so a binding target is always deployed first.
      - name: Migrate and deploy
        shell: bash
        run: |
          set -euo pipefail
          for dir in services/identity services/tenant-directory api; do
            echo "::group::$dir ($DEPLOY_ENV)"
            # The generated wrangler.jsonc has trailing commas but no comments.
            # shellcheck disable=SC2016 # $1 is a JS regex backreference
            db_id=$(node -e '
              const fs = require("fs")
              const c = JSON.parse(fs.readFileSync(process.argv[1], "utf8").replace(/,(\s*[}\]])/g, "$1"))
              const d = c.env?.[process.argv[2]]?.d1_databases?.[0]
              console.log(d ? d.database_id : "none")
            ' "$dir/wrangler.jsonc" "$DEPLOY_ENV")
            if [ "$db_id" = "TO_BE_CREATED" ]; then
              echo "::warning::$dir has no $DEPLOY_ENV D1 database yet; dry-run only."
              (cd "$dir" && pnpm exec wrangler deploy --dry-run --env "$DEPLOY_ENV" --outdir "$RUNNER_TEMP/$(basename "$dir")")
            else
              if [ "$db_id" != "none" ]; then
                (cd "$dir" && pnpm exec wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENV")
              fi
              (cd "$dir" && pnpm exec wrangler deploy --env "$DEPLOY_ENV")
            fi
            echo "::endgroup::"
          done
