name: Run Sanity Migration

# Manually triggered content-migration runner. Exports a dataset backup
# (kept as a workflow artifact) before applying the migration, mirroring
# the manual procedure documented in README.md.
#
# Required repository configuration:
#   secrets.SANITY_AUTH_TOKEN        - token with write access to the dataset
#   vars.SANITY_STUDIO_PROJECT_ID    - the Sanity project id

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration id (directory name under migrations/, e.g. 038-backfill-accepted-cospeakers)'
        required: true
        type: string
      dataset:
        description: 'Target dataset'
        required: true
        type: string
        default: 'production'
      conference_id:
        description: 'Optional conference _id override (exported as BACKFILL_CONFERENCE_ID for migrations that target a conference)'
        required: false
        type: string

# Never run two migrations against the same dataset concurrently
permissions:
  contents: read

concurrency:
  group: sanity-migration-${{ inputs.dataset }}
  cancel-in-progress: false

jobs:
  run-migration:
    name: 'Migrate ${{ inputs.dataset }}: ${{ inputs.migration }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ inputs.dataset }}
      BACKFILL_CONFERENCE_ID: ${{ inputs.conference_id }}
      MIGRATION: ${{ inputs.migration }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4

      - name: Verify migration exists
        run: test -d "migrations/$MIGRATION" || { echo "::error::migrations/$MIGRATION not found"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # ratchet:pnpm/action-setup@v6.1.0
        with:
          version: 10.24.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export dataset backup
        run: pnpm sanity dataset export "$SANITY_STUDIO_DATASET" "backup-$SANITY_STUDIO_DATASET.tar.gz"

      - name: Upload backup artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: 'sanity-backup-${{ inputs.dataset }}-${{ github.run_id }}'
          path: 'backup-${{ inputs.dataset }}.tar.gz'
          retention-days: 30
          if-no-files-found: error

      - name: Dry run
        run: pnpm sanity migration run "$MIGRATION" --project "$SANITY_STUDIO_PROJECT_ID" --dataset "$SANITY_STUDIO_DATASET"

      - name: Run migration
        # --no-confirm: the apply step otherwise prompts for confirmation,
        # which fails in CI (non-interactive). The dry-run step above plus the
        # dataset backup artifact are the safety gates.
        run: pnpm sanity migration run "$MIGRATION" --project "$SANITY_STUDIO_PROJECT_ID" --dataset "$SANITY_STUDIO_DATASET" --no-dry-run --no-confirm
