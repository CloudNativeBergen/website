  """content:write"""
  CONTENT_WRITE

  """members:read"""
  MEMBERS_READ

  """pii:read"""
  PII_READ

  """program:read"""
  PROGRAM_READ

  """program:write"""
  PROGRAM_WRITE

  """sponsors:read"""
  SPONSORS_READ

  """sponsors:write"""
  SPONSORS_WRITE
}

