type Mutation {
  """
  Submit a proposal to the request's conference while its CFP is open. Snapshots the speaker profile into it.
  """
  submitProposal(input: SubmitProposalInput!): MyProposal
  updateMyProposal(id: ID!, input: UpdateMyProposalInput!): MyProposal

  """
  Withdraw a submitted, waitlisted, accepted or confirmed proposal, up to 14 days before the event.
  """
  withdrawMyProposal(
    id: ID!

    """Why, as the site requires; shown to the organizers."""
    reason: String!
  ): MyProposal

  """Stores the last reminder send. Site server lane or operator only."""
  recordWorkshopReminder(count: Int!, sentAt: String!): Boolean!

  """Releases the lock if it is still held by `token`."""
  releaseWorkshopReminder(token: String!): Boolean!

  """
  Claims the request's Conference's hourly workshop-reminder lock, atomically. Site server lane or operator only.
  """
  reserveWorkshopReminder: WorkshopReminderReservation!

  """
  Patches the request's Conference. Requires an org owner or admin, or a platform operator acting for the org (audited).
  """
  updateConference(input: ConferencePatch!): Conference!
  cancelInvitation(invitationId: ID!): Boolean
  changeMemberRole(role: MemberRole!, userId: ID!): Boolean

  """
  Owners only. Refusals: PLAN_REQUIRED, SCOPE_NOT_ALLOWED, LIMIT_REACHED, INVALID_INPUT.
  """
  createApiClient(input: CreateApiClientInput!): ApiClientSecretPayload

  """
  Self-service. Scopes must fit the caller's current role and the org's plan. Refusals: PLAN_REQUIRED, SCOPE_NOT_ALLOWED, LIMIT_REACHED, INVALID_INPUT.
  """
  createPersonalAccessToken(input: CreatePersonalAccessTokenInput!): PersonalAccessTokenPayload
  inviteMember(email: String!, role: MemberRole!): MemberInvitation
  operatorCancelInvitation(invitationId: ID!, orgId: ID!): Boolean
  operatorChangeMemberRole(orgId: ID!, role: MemberRole!, userId: ID!): Boolean
  operatorInviteMember(email: String!, orgId: ID!, role: MemberRole!): MemberInvitation
  operatorRemoveMember(orgId: ID!, userId: ID!): Boolean
  removeMember(userId: ID!): Boolean

  """
  Emergency revocation: removes the user's memberships (except where they are an org's last owner, reported in keptLastOwnerOf), sessions and operator flag, audited. Platform operators only. An issued identity JWT lives up to 300 s more.
  """
  revokeAll(userId: ID!): RevokeAllResult

  """
  Owners and operators. Immediate: bumps token_version, so outstanding access tokens fail on the next request.
  """
  revokeApiClient(id: ID!): Boolean

  """Revokes one of the caller's own tokens. Immediate."""
  revokePersonalAccessToken(id: ID!): Boolean

  """Owners only. The old secret keeps working for a short grace."""
  rotateApiClientSecret(id: ID!): ApiClientSecretPayload

  """
  Writes a demo invitation in any state (#2150). The email must be @example.com or *.test; no email is ever sent (audited as skipped). Platform operators acting for a demo org only (operator lane with a tenant). Idempotent per org, email and status.
  """
  seedDemoInvitation(email: String!, role: MemberRole!, status: SeedInvitationStatus!): MemberInvitation

  """
  Creates or updates a demo seed user (#2150): optionally their membership with `role` and their speaker profile. The email must be @example.com or *.test. A seed user has no credential and can never sign in. Platform operators acting for a demo org only (operator lane with a tenant); audited. Returns the user id.
  """
  seedDemoUser(email: String!, name: String!, profile: SpeakerProfileInput, role: MemberRole): ID

  """
  Stores a web push subscription for the session user. An endpoint another user held moves to the caller.
  """
  subscribePush(input: PushSubscriptionInput!): Boolean

  """Removes the session user's subscription for the endpoint."""
  unsubscribePush(endpoint: String!): Boolean

  """
  Creates or updates the session user's speaker profile. New profiles default to private visibility; network is opt-in.
  """
  updateMyProfile(input: SpeakerProfileInput!): SpeakerProfile

  """
  Claims a custom hostname for one of the org's conferences as pending, with a DNS TXT token (#2207). Routing is unchanged until it verifies. CONFLICT when the hostname is already claimed; NOT_FOUND for a conference outside the org. Org owner or admin.
  """
  claimDomain(conferenceId: ID!, hostname: String!): ConferenceDomain

  """
  Creates an Organization and its first Conference: the Sanity documents (through the site), the directory rows and the owner membership. Retrying with the same idempotencyKey returns the same ids. Platform operators only (operator lane, no tenant).
  """
  createOrganization(idempotencyKey: String!, input: CreateOrganizationInput!): CreatedOrganization

  """
  Creates a sign-up invite code (#2129), valid until `expiresAt` (ISO 8601, in the future). The code is in this result only; just its hash is stored. Platform operators only (operator lane, no tenant).
  """
  createSignupCode(expiresAt: String!, maxUses: Int!, note: String!): SignupCode

  """
  Deletes every invite request from `email` (erasure, #2161); returns how many. Platform operators only (operator lane, no tenant).
  """
  eraseInviteRequests(email: String!): Int

  """
  Opens the Stripe billing portal for the envelope's org (#2129). Org owner only.
  """
  openBillingPortal: BillingPortalSession

  """
  Creates a new conference edition (draft) in an Organization: the Sanity document (through the site) and the directory row. Org owner or admin on the tenant lane, for the envelope's org; or a platform operator (operator lane, no tenant) naming `orgId`, which no other caller may pass. Retrying with the same idempotencyKey returns the same id.
  """
  provisionConference(idempotencyKey: String!, input: ProvisionConferenceInput!, orgId: ID): ProvisionedConference
  provisionOrganization(conferenceId: ID!, idempotencyKey: String!, orgId: ID!, orgSlug: String!): Organization

  """
  Asks for a verification check now (#2207). Once per hostname per minute, else RATE_LIMITED. The DNS check itself arrives in phase 2; until then this returns the current state. Org owner or admin.
  """
  recheckDomain(hostname: String!): ConferenceDomain

  """
  Removes a custom hostname (#2207). FORBIDDEN for platform hosts (<slug>.konf.run). Org owner or admin.
  """
  removeDomain(hostname: String!): ConferenceDomain

  """
  The konf.app "Request an invite" form (#2161). Public; creates no account. Answers true whether or not the email already has an open request. Rate-limited per IP and per email (RATE_LIMITED). Refusals are BAD_USER_INPUT with `field`.
  """
  requestInvite(input: RequestInviteInput!): Boolean

  """
  Sets an invite request's status (#2161), optionally linking the signup code sent; `new` reopens it. Null for an unknown id. Platform operators only (operator lane, no tenant).
  """
  resolveInviteRequest(id: ID!, signupCodeId: ID, status: InviteRequestStatus!): InviteRequest

  """
  Revokes a sign-up invite code; null for an unknown id. Platform operators only (operator lane, no tenant).
  """
  revokeSignupCode(id: ID!): SignupCode

  """
  Grants an Organization a plan without Stripe (#2129), until `until` (ISO 8601; omitted means no end), or ends a grant with `free`. Platform operators only (operator lane, no tenant); audited. Null for an unknown org.
  """
  setComplimentaryPlan(orgId: ID!, plan: Plan!, reason: String!, until: String): Organization

  """
  Sets the request's Conference lifecycle. `cancelled` or `archived` set the homepage override; null clears it (back to `live`; a draft stays draft). `draft` unpublishes and `live` publishes, a draft included (#2150). Org owner or admin, or an operator acting for the org (#1997).
  """
  setConferenceLifecycle(status: ConferenceLifecycleOverride): ConferenceEdition

  """
  Self-serve sign-up in closed preview (#2129): creates an Organization (free, kind customer) with the caller as owner, its first draft edition and the host <slug>.konf.run, and spends one use of `inviteCode`. Returns after the owner membership is written, so `myOrganizations` sees it on the next request. Any signed-in user, on a session with no tenant; attempts are rate-limited per user (RATE_LIMITED). Refusals are BAD_USER_INPUT with `field` inviteCode, then slug, then name.
  """
  signUpOrganization(input: SignupOrganizationInput!, inviteCode: String!): SignupResult

  """
  Starts a Stripe Checkout session for a yearly plan for the envelope's org (#2129, docs/BILLING.md). Org owner only. Refused for a demo org and an org on an active complimentary plan.
  """
  startCheckout(currency: Currency!, plan: PaidPlan!): CheckoutSession

  """
  Binds a provider event to the envelope's conference, the mapping ticket ingest trusts. Platform operators only (conference.bind_ticketing).
  """
  bindTicketEvent(event: TicketEventRefInput!): Boolean

  """
  Writes sample orders for a demo org (orgKind demo, owner or admin, or an operator for it). The event must have provider `demo`; its accountId is always the org id. Idempotent per order externalId. Returns the number of orders.
  """
  seedTicketOrders(event: TicketEventRefInput!, orders: [TicketOrderInput!]!): Int
}

