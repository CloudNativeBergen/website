}

"""
The moved Conference fields. An omitted field is left as it is; null unsets it.
"""
input ConferencePatch {
  accentColor: String
  analyticsPirschCode: String
  backgroundPattern: String
  cfpEmail: String
  cfpEndDate: String
  cfpNotificationChannel: String
  cfpNotifyDate: String
  cfpStartDate: String
  city: String
  contactEmail: String
  country: String
  earlyBirdEndDate: String
  endDate: String
  organizer: String
  organizerAddress: String
  organizerOrgNumber: String
  primaryColor: String
  programDate: String

  """False when Sanity marks the edition cancelled or archived. Not null."""
  published: Boolean
  recordingsLiveDate: String
  registrationCloseDate: String
  registrationEnabled: Boolean
  registrationLink: String
  salesNotificationChannel: String
  showVanityMetrics: Boolean
  socialHashtag: String

  """http(s) URLs. Not null."""
  socialLinks: [String!]
  speakerRegistrationLink: String
  speakerSlackChannel: String
  speakerSlackInviteUrl: String
  speakersAnnouncedDate: String
  sponsorDeadlineDate: String
  sponsorEmail: String
  sponsorRegistrationLink: String
  startDate: String
  tagline: String
  title: String

  """Zero or more."""
  travelSupportBudget: Float
  travelSupportPaymentDate: String
  venueAddress: String
  venueName: String

  """`live` or `unlisted`. Not null."""
  visibility: String
  volunteerRegistrationLink: String
  volunteerSlackInviteUrl: String
}

