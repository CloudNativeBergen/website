type Conference {
  id: ID
  accentColor: String

  """Org members only."""
  analyticsPirschCode: String
  backgroundPattern: String
  cfpEmail: String
  cfpEndDate: String

  """Org members only."""
  cfpNotificationChannel: String
  cfpNotifyDate: String
  cfpStartDate: String
  city: String
  contactEmail: String
  country: String
  earlyBirdEndDate: String
  endDate: String
  organizer: String

  """Org members only."""
  organizerAddress: String

  """Org members only."""
  organizerOrgNumber: String
  primaryColor: String
  programDate: String
  recordingsLiveDate: String
  registrationCloseDate: String
  registrationEnabled: Boolean
  registrationLink: String

  """Org members only."""
  salesNotificationChannel: String

  """ticketCustomization.showVanityMetrics in Sanity."""
  showVanityMetrics: Boolean
  socialHashtag: String
  socialLinks: [String!]

  """Org members only."""
  speakerRegistrationLink: String

  """Org members only."""
  speakerSlackChannel: String

  """Org members only."""
  speakerSlackInviteUrl: String
  speakersAnnouncedDate: String
  sponsorDeadlineDate: String
  sponsorEmail: String

  """Org members only."""
  sponsorRegistrationLink: String
  startDate: String
  tagline: String
  title: String

  """Org members only."""
  travelSupportBudget: Float
  travelSupportPaymentDate: String
  venueAddress: String
  venueName: String

  """`unlisted`: reachable by link, not indexed."""
  visibility: String
  volunteerRegistrationLink: String

  """Org members only."""
  volunteerSlackInviteUrl: String

  """Portable Text as JSON (Sanity shape)."""
  announcement: String
  description: String
  formats: [String!]

  """The homepage sections in order. Hidden ones only for org members."""
  homepageBlocks: [HomepageSection!]

  """The homepage section list as JSON (Sanity shape)."""
  homepageSections: String @deprecated(reason: "Use homepageBlocks.")
  lifecycleHeadline: String
  lifecycleMessage: String
  localRecommendations: String
  logoBright: String
  logoDark: String
  logomarkBright: String
  logomarkDark: String

  """
  The speaker information object as JSON (Sanity shape). Non-members get what /info shows: no on-site phone, no dinner RSVP note.
  """
  speakerInfo: String

  """The sponsorship page copy as JSON (Sanity shape)."""
  sponsorshipCustomization: String
  ticketCustomization: TicketCustomization
  ticketFaqs: [Faq!]
  ticketInclusions: [TicketInclusion!]
  vanityMetrics: [VanityMetric!]
  venueTravelInfo: String
}

type ConferenceEdition {
  id: ID
  endDate: String

  """False when the edition is cancelled or archived."""
  published: Boolean
  startDate: String
  title: String
  visibility: String

  """
  `draft`, `live`, `cancelled` or `archived`. Org members see every value; anyone else only `live`, and null otherwise.
  """
  lifecycleStatus: String

  """
  The edition's canonical host: a verified custom domain, else its verified platform-edition host, else null. Never pending or failed. Same visibility as lifecycleStatus.
  """
  primaryHost: String
}

type Mutation {
  """Patches the request's Conference. Requires an org owner or admin."""
  updateConference(input: ConferencePatch!): Conference!
  cancelInvitation(invitationId: ID!): Boolean
  changeMemberRole(role: MemberRole!, userId: ID!): Boolean
  inviteMember(email: String!, role: MemberRole!): MemberInvitation
  operatorCancelInvitation(invitationId: ID!, orgId: ID!): Boolean
  operatorChangeMemberRole(orgId: ID!, role: MemberRole!, userId: ID!): Boolean
  operatorInviteMember(email: String!, orgId: ID!, role: MemberRole!): MemberInvitation
  operatorRemoveMember(orgId: ID!, userId: ID!): Boolean

  """
  Deletes endpoints the push service answered 404 or 410 for. Platform context only.
  """
  prunePushSubscriptions(endpoints: [String!]!): Int
  removeMember(userId: ID!): Boolean

  """
  Stores a web push subscription for the session user. An endpoint another user held moves to the caller.
  """
  subscribePush(input: PushSubscriptionInput!): Boolean

  """Removes the session user's subscription for the endpoint."""
  unsubscribePush(endpoint: String!): Boolean
  provisionOrganization(conferenceId: ID!, idempotencyKey: String!, orgId: ID!, orgSlug: String!): Organization

  """
  Sets the request's Conference homepage override, or clears it with null (back to `live`; a draft stays draft). Org owner or admin, or an operator acting for the org (#1997).
  """
  setConferenceLifecycle(status: ConferenceLifecycleOverride): ConferenceEdition
}

type Query {
  """
  The request's Conference. Null when the request has none, or it is unpublished and the caller is not an org member.
  """
  conference: Conference

  """
  The request's organization's editions, newest first. Unpublished and unlisted editions only for org members.
  """
  conferenceEditions: [ConferenceEdition!]!

  """
  The session org's pending invitations. Owners, admins and operators only; null otherwise.
  """
  invitations: [PendingInvitation!]

  """
  The session org's members. Null unless the caller is a member or an operator acting for the tenant.
  """
  members: [OrganizationMember!]
  program: Program
  speaker(id: ID!): Speaker
  speakerBySlug(slug: String!): Speaker
  speakers: [Speaker!]
  talk(id: ID!): Talk

  """
  The request's Conference lifecycle: `live`, `cancelled` or `archived` for anyone, `draft` only for org members. Public because a cancelled or archived homepage says so to every visitor (#1997).
  """
  conferenceLifecycle: String

  """
  Every org's conferences, ordered by id. Platform operators only (operator lane, no tenant). At most 100 per page: pass the last id as `after` for the next. `lifecycle` and `flag` (that flag on) filter.
  """
  conferences(after: ID, first: Int = 100, flag: RolloutFlag, lifecycle: ConferenceLifecycle): [OperatorConference!]

  """
  The signed-in user's own organizations, with their role and every conference edition (#2036). Kontroll's member lane: a session with no tenant. Refused with a tenant envelope or none.
  """
  myOrganizations: [MyOrganization!]

  """
  The session's Organization: members (any role) and operators acting for it. Null for everyone else.
  """
  organization: Organization

  """
  Every Organization, ordered by slug. Platform operators only (operator lane, no tenant). At most 100 per page: pass the last slug as `after` for the next.
  """
  organizations(after: String, first: Int = 100): [Organization!]
  health: String!
  rolloutFlags: SiteRolloutFlags
}

