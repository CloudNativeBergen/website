  speakers: [MyProposalSpeaker!]

  """
  draft, submitted, accepted, waitlisted, confirmed, rejected, withdrawn, canceled or deleted.
  """
  status: String
  title: String
  topicIds: [ID!]

  """Whether the Terms of Service were accepted."""
  tos: Boolean

  """myProposals is ordered by this, newest first."""
  updatedAt: String
  withdrawnReason: String
}

